<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approvals — HappyMaps Admin</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#FFB300" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-nav">
      <div class="admin-nav-inner">
        <a href="/admin/approvals.html" class="admin-logo">
          <img src="/assets/images/HappyMapsAppIcon.png" alt="" />
          <span>HappyMaps Admin</span>
        </a>
        <div class="admin-nav-links">
          <a href="/admin/approvals.html">Approvals</a>
          <a href="/admin/audit.html">Audit</a>
          <a href="/admin/venues.html">Venues</a>
        </div>
        <div class="admin-nav-spacer"></div>
        <button id="sign-out-btn" type="button">Sign out</button>
      </div>
    </nav>

    <main class="admin-main">
      <div class="page-header">
        <h1 class="page-title">Approvals</h1>
        <span id="count" class="page-subtitle"></span>
      </div>

      <div id="banner" class="banner banner-error" role="alert"></div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Pending events</span>
        </div>
        <div id="content-events">
          <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
      </div>

      <div class="card" style="margin-top: 24px;">
        <div class="card-header">
          <span class="card-title">Pending promotions</span>
        </div>
        <div id="content-promotions">
          <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import {
      supabase, requireAdmin, initAdminNav,
      escapeHtml, formatRelativeTime, formatEventDate,
      showToast, showBanner, clearBanner,
    } from '/admin/admin.js';

    const REJECT_CATEGORIES = [
      { value: 'inappropriate',  label: 'Inappropriate' },
      { value: 'duplicate',      label: 'Duplicate' },
      { value: 'incorrect_info', label: 'Incorrect info' },
      { value: 'spam',           label: 'Spam' },
      { value: 'other',          label: 'Other (specify)' },
    ];

    const countEl = document.getElementById('count');
    const pendingCounts = { events: 0, promotions: 0 };

    function updateCount() {
      const total = pendingCounts.events + pendingCounts.promotions;
      countEl.textContent = total === 0 ? 'All caught up' : `${total} pending`;
    }

    // "Aug 28" / "Aug 28 – Sep 30"
    function formatDateRange(startsOn, endsOn) {
      const md = (ymd) => {
        const [y, m, d] = ymd.split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      };
      return startsOn === endsOn ? `${md(startsOn)} only` : `${md(startsOn)} – ${md(endsOn)}`;
    }

    // One queue definition per moderated table. Both share the row chrome,
    // the reject form, and the approve/reject wiring; only the query, the
    // RPC names, and the middle columns differ.
    const QUEUES = {
      events: {
        key: 'events',
        contentEl: document.getElementById('content-events'),
        noun: 'event',
        emptyTitle: 'No events to review.',
        columns: ['Bar', 'Event', 'When', 'Submitted'],
        approveRpc: 'approve_event',
        rejectRpc:  'reject_event',
        idParam:    'p_event_id',
        query: () => supabase
          .from('events')
          .select('id, name, description, event_date, start_time, end_time, created_at, bar_id, bar:bars(name, neighborhood)')
          .eq('status', 'pending')
          .order('created_at', { ascending: true }),
        nameOf: (r) => r.name,
        cells: (r) => [
          `<div class="cell-stack">
             <span class="cell-strong">${escapeHtml(r.name)}</span>
             ${r.description ? `<div class="cell-stack-sub">${escapeHtml(r.description)}</div>` : ''}
           </div>`,
          `<span class="cell-mono">${escapeHtml(formatEventDate(r.event_date, r.start_time, r.end_time))}</span>`,
        ],
      },
      promotions: {
        key: 'promotions',
        contentEl: document.getElementById('content-promotions'),
        noun: 'promotion',
        emptyTitle: 'No promotions to review.',
        columns: ['Bar', 'Offer', 'Runs', 'Submitted'],
        approveRpc: 'approve_promotion',
        rejectRpc:  'reject_promotion',
        idParam:    'p_promotion_id',
        query: () => supabase
          .from('promotions')
          .select('id, title, details, starts_on, ends_on, created_at, bar_id, bar:bars(name, neighborhood)')
          .eq('status', 'pending')
          .order('created_at', { ascending: true }),
        nameOf: (r) => r.title,
        cells: (r) => [
          `<div class="cell-stack">
             <span class="cell-strong">${escapeHtml(r.title)}</span>
             ${r.details ? `<div class="cell-stack-sub">${escapeHtml(r.details)}</div>` : ''}
           </div>`,
          `<span class="cell-mono">${escapeHtml(formatDateRange(r.starts_on, r.ends_on))}</span>`,
        ],
      },
    };

    async function loadQueue(q) {
      q.contentEl.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';

      const { data, error } = await q.query();
      if (error) {
        q.contentEl.innerHTML = '';
        showBanner(`Failed to load pending ${q.noun}s: ${error.message}`);
        pendingCounts[q.key] = 0;
        updateCount();
        return;
      }

      pendingCounts[q.key] = data.length;
      updateCount();

      if (data.length === 0) {
        q.contentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">${q.emptyTitle}</div>
            <div>You're all caught up.</div>
          </div>`;
        return;
      }

      q.contentEl.innerHTML = `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                ${q.columns.map(c => `<th>${c}</th>`).join('')}
                <th class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(r => renderRow(q, r)).join('')}
            </tbody>
          </table>
        </div>`;

      data.forEach(r => wireRow(q, r));
    }

    function renderRow(q, r) {
      const barName = r.bar?.name || '—';
      const neighborhood = r.bar?.neighborhood || '';
      const [primaryCell, whenCell] = q.cells(r);
      return `
        <tr data-row-id="${q.key}:${r.id}">
          <td>
            <div class="cell-stack">
              <span class="cell-strong">${escapeHtml(barName)}</span>
              ${neighborhood ? `<span class="cell-stack-sub">${escapeHtml(neighborhood)}</span>` : ''}
            </div>
          </td>
          <td>${primaryCell}</td>
          <td>${whenCell}</td>
          <td class="cell-muted">${escapeHtml(formatRelativeTime(r.created_at))}</td>
          <td class="col-actions">
            <div class="btn-row">
              <button class="btn btn-primary btn-sm" data-action="approve">Approve</button>
              <button class="btn btn-destructive btn-sm" data-action="reject">Reject</button>
            </div>
          </td>
        </tr>
        <tr class="reject-form-row" data-reject-form-for="${q.key}:${r.id}" hidden>
          <td colspan="5">
            <form class="reject-form">
              <div class="reject-form-controls">
                <div class="field">
                  <label class="label">Reason category</label>
                  <select class="select" name="category" required>
                    ${REJECT_CATEGORIES.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}
                  </select>
                </div>
                <div class="field" style="flex: 2; min-width: 260px;">
                  <label class="label">Detail (required if "Other")</label>
                  <input class="input" name="text" type="text" maxlength="500" placeholder="Optional context for the venue" />
                </div>
              </div>
              <div class="btn-row">
                <button type="submit" class="btn btn-destructive btn-sm">Confirm rejection</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="cancel-reject">Cancel</button>
              </div>
              <div class="error-msg" data-reject-error></div>
            </form>
          </td>
        </tr>`;
    }

    function wireRow(q, r) {
      const row = document.querySelector(`tr[data-row-id="${q.key}:${r.id}"]`);
      const formRow = document.querySelector(`tr[data-reject-form-for="${q.key}:${r.id}"]`);
      if (!row || !formRow) return;

      const approveBtn = row.querySelector('button[data-action="approve"]');
      const rejectBtn = row.querySelector('button[data-action="reject"]');
      const cancelBtn = formRow.querySelector('button[data-action="cancel-reject"]');
      const form = formRow.querySelector('form');

      approveBtn.addEventListener('click', () => approveRow(q, r, approveBtn, rejectBtn));
      rejectBtn.addEventListener('click', () => { formRow.hidden = false; });
      cancelBtn.addEventListener('click', () => { formRow.hidden = true; });
      form.addEventListener('submit', (e) => { e.preventDefault(); rejectRow(q, r, form); });
    }

    async function approveRow(q, r, approveBtn, rejectBtn) {
      approveBtn.disabled = true;
      rejectBtn.disabled = true;
      approveBtn.textContent = 'Approving…';
      const { error } = await supabase.rpc(q.approveRpc, { [q.idParam]: r.id });
      if (error) {
        approveBtn.disabled = false;
        rejectBtn.disabled = false;
        approveBtn.textContent = 'Approve';
        showToast(error.message || 'Approve failed', 'error');
        return;
      }
      showToast(`Approved: ${q.nameOf(r)}`, 'success');
      loadQueue(q);
    }

    async function rejectRow(q, r, form) {
      const errEl = form.querySelector('[data-reject-error]');
      errEl.textContent = '';
      const submitBtn = form.querySelector('button[type="submit"]');
      const category = form.elements.category.value;
      const text = form.elements.text.value.trim();

      if (category === 'other' && !text) {
        errEl.textContent = 'Detail is required when category is "Other".';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Rejecting…';

      const { error } = await supabase.rpc(q.rejectRpc, {
        [q.idParam]: r.id,
        p_reason_category: category,
        p_reason_text: text || null,
      });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm rejection';
        errEl.textContent = error.message || 'Reject failed';
        return;
      }

      showToast(`Rejected: ${q.nameOf(r)}`, 'success');
      loadQueue(q);
    }

    async function load() {
      clearBanner();
      await Promise.all([loadQueue(QUEUES.events), loadQueue(QUEUES.promotions)]);
    }

    (async () => {
      const admin = await requireAdmin();
      if (!admin) return;
      initAdminNav();
      await load();
    })();
  </script>
</body>
</html>
